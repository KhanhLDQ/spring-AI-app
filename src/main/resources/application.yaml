spring:
  application:
    name: spring-AI-app
  profiles:
    default: mock
  ai:
    model:
      chat: anthropic
      embedding: openai
      image: none
      audio.speech: none
      audio.transcription: none
      moderation: none
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: never   # Flyway owns spring_ai_chat_memory (V4)
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      # Provider-side limits: a failing call is retried at most twice and each attempt is bounded, so a bad
      # network cannot quietly spend the budget. The whole chat turn is also capped (ChatService.TURN_TIMEOUT).
      max-retries: 2
      timeout: 45s
    openai:
      api-key: ${OPENAI_API_KEY}
      max-retries: 2
      timeout: 20s
      embedding:
        options:
          model: text-embedding-3-small   # pinned: the library default is an older model with compressed scores
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kefir}
    username: ${DB_USERNAME:kefir}
    password: ${DB_PASSWORD}
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: ${kefir.knowledge.max-file-size}
      max-request-size: ${kefir.knowledge.max-file-size}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

kefir:
  cache:
    similarity-threshold: 0.85
    ttl: 24h
  memory:
    window-size: 20
  knowledge:
    max-file-size: 10MB
    max-pages: 50
    chunk-tokens: 400
    seed-on-start: true
    rag:
      top-k: 3
      similarity-threshold: 0.50
    router:
      similarity-threshold: 0.50
      # Measured with text-embedding-3-small: order requests lead by 0.14+, a question that also orders by 0.09 at most.
      margin: 0.12
  jwt:
    signing-key: ${JWT_SIGNING_KEY:}
    ttl: 24h
  budget:
    limit-usd: 5
  pricing:
    input-per-mtok: 2
    output-per-mtok: 10
