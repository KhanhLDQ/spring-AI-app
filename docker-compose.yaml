services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: kefir
      POSTGRES_USER: kefir
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
