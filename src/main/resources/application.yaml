spring:
  application:
    name: spring-AI-app
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kefir}
    username: ${DB_USERNAME:kefir}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
