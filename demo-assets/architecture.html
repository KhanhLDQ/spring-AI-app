<meta charset="utf-8">
<title>Kefir AI App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one presenter screen. Top bar (flow tabs) → blueprint diagram that fills the stage → caption bar with the current step and controls.
   Light theme, same palette as the Kefir app (frontend/src/styles/tokens.css): white boxes on a cool grey board, kind colours deep enough to read on white. */
:root {
  --bg: #F4F5F9;
  --panel: #FAFBFD;
  --panel2: #FFFFFF;
  --line: #DFE3EC;
  --edge: #C3C9D8;
  --edge-strong: #8E96B0;
  --tint: #171A2B06;
  --tint2: #171A2B0A;
  --ink: #171A2B;
  --ink2: #363B52;
  --ink-strong: #0E1020;
  --muted: #5B6380;
  --accent: #3B36A0;
  --k-http: #2F6FD6; --k-sec: #C2408A; --k-svc: #5B6380; --k-cache: #0E8A62; --k-memory: #5B6489; --k-rag: #0A7D93;
  --k-tool: #5A52D5; --k-model: #B26A00; --k-db: #17806A; --k-embed: #4E8A1F; --k-mcp: #C25E12; --k-obs: #7A5AD6; --k-test: #C93E3E;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--font-body); padding-inline: 16px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; color: inherit; cursor: pointer; }

.app { height: 100%; display: flex; flex-direction: column; gap: 10px; padding-block: 12px; max-width: 1640px; margin-inline: auto; }

.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand i { width: 32px; height: 32px; border-radius: 50% 50% 50% 8px; background: var(--accent); color: #FFFFFF; display: grid; place-items: center; font: 800 16px var(--font-display); font-style: normal; }
.brand h1 { margin: 0; font: 800 22px/1.05 var(--font-display); letter-spacing: -.02em; }
.brand small { display: block; color: var(--muted); font: 500 11.5px var(--font-mono); letter-spacing: .02em; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tabs button { --kc: var(--accent); display: inline-flex; align-items: center; gap: 8px; background: transparent; border: 1px solid var(--line); border-radius: 99px; padding: 6px 13px; font-size: 13px; color: var(--muted); }
.tabs button::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--kc); opacity: .55; }
.tabs button:hover { color: var(--ink); border-color: var(--edge-strong); }
.tabs button[aria-selected="true"] { background: var(--panel2); color: var(--ink); border-color: var(--kc); font-weight: 600; }
.tabs button[aria-selected="true"]::before { opacity: 1; }

.stage { flex: 1; min-height: 420px; background: radial-gradient(circle at 1px 1px, #171A2B14 1px, transparent 0) 0 0 / 20px 20px, var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: auto; }
.stage svg { display: block; width: 100%; height: 100%; min-width: 1000px; min-height: 600px; }

/* diagram */
.lane-lb { fill: var(--muted); font: 600 11px var(--font-body); letter-spacing: .14em; }
.frame { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 5; }
.frame-lb { fill: var(--muted); font: 500 11px var(--font-mono); }
.group { fill: var(--tint); stroke: var(--line); stroke-width: 1; }
.grp.on .group { stroke: var(--kc); stroke-width: 2; fill: color-mix(in srgb, var(--kc) 8%, transparent); }
.grp.on .group-lb { fill: var(--kc); }
.group-lb { fill: var(--muted); font: 600 10.5px var(--font-mono); letter-spacing: .04em; }

.edge { fill: none; stroke: var(--edge); stroke-width: 1.3; transition: stroke .3s, opacity .3s; }
.edge.hot { stroke: var(--kc); stroke-width: 2.2; }
.edge.dimmed { opacity: .25; }
.dot { fill: var(--kc); filter: drop-shadow(0 0 5px var(--kc)); }

.node rect.box { fill: var(--panel2); stroke: var(--edge); stroke-width: 1.2; transition: fill .3s, stroke .3s; }
.node .bar { fill: var(--kc); }
.node .lb { fill: var(--ink); font: 600 12.5px var(--font-body); }
.node .sb { fill: var(--muted); font: 400 10px var(--font-mono); }
.node .tag { fill: var(--kc); font: 600 9.5px var(--font-mono); }
.node { transition: opacity .35s; }
.node.on rect.box { fill: color-mix(in srgb, var(--kc) 9%, var(--panel2)); stroke: var(--kc); stroke-width: 2; }
.node.on .lb { fill: var(--ink-strong); }
.node.seen rect.box { stroke: var(--edge-strong); }
.node.dimmed { opacity: .28; }
.node.pulse rect.box { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { stroke-width: 3.2; } }

.k-http { --kc: var(--k-http); } .k-sec { --kc: var(--k-sec); } .k-svc { --kc: var(--k-svc); } .k-cache { --kc: var(--k-cache); }
.k-memory { --kc: var(--k-memory); } .k-rag { --kc: var(--k-rag); } .k-tool { --kc: var(--k-tool); } .k-model { --kc: var(--k-model); }
.k-test { --kc: var(--k-test); } .k-db { --kc: var(--k-db); } .k-embed { --kc: var(--k-embed); } .k-mcp { --kc: var(--k-mcp); } .k-obs { --kc: var(--k-obs); }

/* caption bar */
.cap { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 24px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; }
.cap-main { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.cap-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font: 500 12px var(--font-mono); color: var(--muted); }
.cap-meta .n { color: var(--kc); font-weight: 600; font-variant-numeric: tabular-nums; }
.cap h2 { margin: 0; font: 800 22px/1.2 var(--font-display); letter-spacing: -.015em; text-wrap: balance; }
.cap p { margin: 0; color: var(--ink2); max-width: 95ch; }
.cap code { font: 500 12px var(--font-mono); color: var(--kc); overflow-wrap: anywhere; }
.ctl { display: flex; align-items: center; gap: 8px; }
.ctl button { background: var(--panel2); border: 1px solid var(--line); border-radius: 9px; padding: 8px 14px; font-weight: 600; font-size: 14px; }
.ctl button:hover { border-color: var(--edge-strong); }
.ctl .play { background: var(--k-model); color: #FFFFFF; border-color: transparent; min-width: 96px; }
.steps { grid-column: 1 / -1; display: flex; gap: 4px; }
.steps button { flex: 1; height: 6px; border: 0; padding: 0; border-radius: 3px; background: var(--line); }
.steps button.past { background: var(--edge-strong); }
.steps button[aria-current="step"] { background: var(--kc); }
.hint { color: var(--muted); font-size: 12px; }


/* Cover slide (first slide of the Introduction tab): a box that opens and lets the Spring AI parts float out. Pure CSS 3D, no library, so it also works offline. */
.cover { position: relative; width: 100%; height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: center; gap: 24px; padding: 24px clamp(16px, 4vw, 64px); overflow: hidden;
  background: radial-gradient(60% 70% at 72% 45%, color-mix(in srgb, var(--accent) 11%, transparent), transparent 70%); }
.cover .txt { position: relative; z-index: 1; padding-left: 2vw; animation: cv-in .9s ease-out both; }
.cover .eyebrow { font: 600 12px var(--font-mono); letter-spacing: .22em; color: var(--accent); text-transform: uppercase; }
.cover h1 { margin: 14px 0 0; font: 800 clamp(48px, 6.4vw, 104px)/.92 var(--font-display); letter-spacing: -.035em; color: var(--ink-strong); }
.cover h1 span { display: block; color: transparent; background: linear-gradient(100deg, var(--accent), var(--k-obs) 45%, var(--k-rag)); -webkit-background-clip: text; background-clip: text; }
.cover .scene { position: relative; height: min(100%, 560px); min-height: 380px; perspective: 1100px; perspective-origin: 50% 30%; }
.cover .zoom { position: absolute; inset: 0; transform-style: preserve-3d; }
@media (min-width: 1400px) { .cover .zoom { transform: scale(1.3); } }
@media (min-width: 1750px) { .cover .zoom { transform: scale(1.5); } }
.cover .rig { position: absolute; left: 46%; top: 50%; transform-style: preserve-3d; animation: cv-spin 16s linear infinite; }
.cover .rig > * { position: absolute; transform-style: preserve-3d; }
/* The box only turns (right to left): pale accent faces, faint rings on the floor. */
.cover .face { left: -90px; top: -90px; width: 180px; height: 180px; border: 1.5px solid color-mix(in srgb, var(--accent) 55%, var(--edge)); border-radius: 6px;
  background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 9%, #FFFFFF), color-mix(in srgb, var(--accent) 20%, #FFFFFF)); backface-visibility: visible; }
.cover .face.f { transform: translateZ(90px); display: grid; place-items: center; }
.cover .face.f em { font: 800 22px var(--font-display); font-style: normal; color: var(--accent); letter-spacing: -.02em; text-align: center; line-height: 1.05; }
.cover .face.f em small { display: block; margin-top: 6px; font: 500 10.5px var(--font-mono); letter-spacing: .14em; color: var(--muted); }
.cover .face.bk { transform: rotateY(180deg) translateZ(90px); }
.cover .face.r { transform: rotateY(90deg) translateZ(90px); }
.cover .face.l { transform: rotateY(-90deg) translateZ(90px); }
.cover .face.bt { transform: rotateX(-90deg) translateZ(90px); }
.cover .face.lid { transform: rotateX(90deg) translateZ(90px); }
.cover .floor { left: -280px; top: -280px; width: 560px; height: 560px; border-radius: 50%; transform: rotateX(90deg) translateZ(-91px);
  background: repeating-radial-gradient(circle, transparent 0 34px, color-mix(in srgb, var(--accent) 16%, transparent) 34px 35.5px);
  -webkit-mask: radial-gradient(closest-side, #000 55%, transparent); mask: radial-gradient(closest-side, #000 55%, transparent); }
.cover .shadow { left: -150px; top: -150px; width: 300px; height: 300px; border-radius: 50%; transform: rotateX(90deg) translateZ(-92px);
  background: radial-gradient(closest-side, #171A2B24, transparent); }
@keyframes cv-in { from { opacity: 0; transform: translateY(14px); } }
@keyframes cv-spin { from { transform: rotateX(-20deg) rotateY(0deg); } to { transform: rotateX(-20deg) rotateY(-360deg); } }
@media (prefers-reduced-motion: reduce) { .cover *, .cover .txt { animation-duration: .001s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; } }

/* Spring AI concepts view (scoped to .cpt so it never touches the architecture diagram) */
[hidden] { display: none !important; }
.cpt { width: 100%; height: 100%; }
.cpt svg { display: block; width: 100%; height: 100%; min-width: 760px; min-height: 0; }
.cpt .box { fill: var(--panel2); stroke: var(--edge); stroke-width: 1.3; }
.cpt .n.on .box { stroke: var(--kc); stroke-width: 2.2; fill: color-mix(in srgb, var(--kc) 9%, var(--panel2)); }
.cpt .n .bar { fill: var(--kc); }
.cpt .n .lb { fill: var(--ink); font: 600 16px var(--font-body); }
.cpt .n .sb { fill: var(--muted); font: 400 12px var(--font-mono); }
.cpt .ln { fill: var(--ink2); font: 400 13px var(--font-mono); }
.cpt .n .ln.hist { fill: var(--k-memory); }
.cpt .n .ln.new { fill: var(--ink-strong); font-weight: 600; }
.cpt .n.muted { opacity: .45; }
.cpt .edge { fill: none; stroke: var(--edge); stroke-width: 1.6; }
.cpt .edge.hot { stroke: var(--kc); stroke-width: 2.2; }
.cpt .edge.alt { stroke-dasharray: 5 5; opacity: .6; }
.cpt .dot { fill: var(--kc); filter: drop-shadow(0 0 6px var(--kc)); }
.cpt .note { fill: var(--muted); font: 500 12px var(--font-mono); }
.cpt .note.k { fill: var(--kc); }
.cpt .tag { fill: var(--kc); font: 700 12px var(--font-mono); }
.cpt .grid-dot { fill: var(--edge); }
.cpt .grid-dot.hit { fill: var(--k-rag); filter: drop-shadow(0 0 5px var(--k-rag)); }
.cpt .axis { stroke: var(--edge); stroke-width: 1; }
.cpt .wf-bar { fill: var(--kc); transform-box: fill-box; transform-origin: left center; animation: grow .6s ease-out both; }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.k-bad { --kc: #C0352B; }
/* code pop-up: opened by clicking the file reference in the caption, only on steps that carry real code */
.cap { position: relative; }
.cap code.has-snip { cursor: pointer; border: 1px solid color-mix(in srgb, var(--kc) 45%, transparent); border-radius: 6px; padding: 1px 7px; }
.cap code.has-snip::after { content: " </>"; font-weight: 700; }
.cap code.has-snip:hover, .cap code.has-snip[aria-expanded="true"] { background: color-mix(in srgb, var(--kc) 16%, transparent); }
.snip { position: absolute; left: 18px; bottom: calc(100% + 10px); max-width: min(980px, calc(100% - 36px)); background: var(--panel2); border: 1px solid var(--kc); border-radius: 12px; padding: 12px 0; box-shadow: 0 18px 50px #1A1F3A2E; z-index: 5; overflow-x: auto; }
.snip .f { padding: 0 16px 4px; color: var(--muted); font: 500 11px var(--font-mono); }
.snip .f + pre, .snip pre + .f { margin-top: 0; }
.snip pre + .f { padding-top: 10px; border-top: 1px solid var(--line); margin-top: 10px; }
.snip pre { margin: 0; padding: 0 16px; font: 500 14px/1.6 var(--font-mono); color: var(--ink); white-space: pre; }
.snip pre i { font-style: normal; color: var(--edge-strong); user-select: none; display: inline-block; min-width: 3ch; margin-right: 12px; text-align: right; }
.cap .row { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 12px; align-items: baseline; }
.cap .row b { font: 600 10.5px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--kc); }
.cap .row span { color: var(--ink2); font-size: 15.5px; }
@media (max-width: 760px) {
  .cap { grid-template-columns: 1fr; }
  .brand h1 { font-size: 19px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><i>K</i><div><h1>Kefir AI App</h1><small>React 19 · Java 25 · Spring Boot 4.1.1 · Spring AI 2.0.1 · PostgreSQL 17 + pgvector</small></div></div>

  </section>
</div>

      { title: "RelevancyEvaluator", nodes: ["evals", "chatCtrl", "anth"], edges: ["evals_chat", ["evals_chat", 1], "evals_anth", ["evals_anth", 1]], snips: ["eval_rel"],
        text: "Đưa câu hỏi, chunk tri thức và câu trả lời cho model chấm: câu trả lời có đúng trọng tâm câu hỏi và khớp với tri thức không." },
      { title: "FactCheckingEvaluator", nodes: ["evals", "chatCtrl", "anth"], edges: ["evals_chat", ["evals_chat", 1], "evals_anth", ["evals_anth", 1]], snips: ["eval_fact", "eval_fake"],
        text: "Kiểm câu trả lời có dựa trên tài liệu không. Câu trả lời thật thì pass; câu bịa \"để được 30 ngày\" thì fail." },
    ]},
    { id: "mcp", name: "MCP", kind: "mcp", focus: true, steps: [
      // The same @Tool methods the chat uses, now called by an outside AI client over MCP.
      { title: "MCP là gì", nodes: ["claude", "mcpEp"], edges: ["cc_mcp"], snips: ["mcp_starter", "mcp_yaml"],
        text: "Model Context Protocol là chuẩn mở để AI client bên ngoài gọi tool của ứng dụng. Thêm starter là app thành MCP server, endpoint /mcp." },
      { title: "Đăng ký tool", nodes: ["claude", "mcpEp", "ctools", "ktools"], edges: ["cc_mcp", "mcp_ctools", "mcp_ktools"], snips: ["mcp_tools"],
        text: "Dùng lại đúng các @Tool của chat, chỉ đăng ký 3 tool chỉ đọc: listProducts, getProduct, searchKnowledge. Client gọi tool như chatbot gọi, chạy qua cùng service." },
    ]},
  ];

  // ───────────────────────── render ─────────────────────────
  const svgNS = "http://www.w3.org/2000/svg";
  const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  // Squeeze a label into its box when the estimated width would overflow it.
  const fit = (text, avail, px) => text.length * px > avail ? ` textLength="${avail}" lengthAdjust="spacingAndGlyphs"` : "";
  let s = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Sơ đồ kiến trúc Kefir AI">`;
  s += `<text class="lane-lb" x="20" y="40">CLIENT</text><text class="lane-lb" x="244" y="40">SPRING BOOT APP</text>`;
  s += `<text class="lane-lb" x="920" y="40">AI PROVIDERS</text><text class="lane-lb" x="1076" y="40">DATA</text>`;
  s += `<rect class="frame" x="230" y="50" width="672" height="738" rx="14"/>`;
  s += `<rect class="frame" x="1066" y="100" width="234" height="636" rx="12"/>`;
  s += `<text class="frame-lb" x="1076" y="88">PostgreSQL 17 + pgvector</text>`;
  s += `<rect class="group" x="430" y="104" width="458" height="72" rx="10"/><text class="group-lb" x="440" y="118">KnowledgeService · ETL</text>`;
  s += `<g class="grp k-obs" id="g-chatClient"><rect class="group" x="586" y="190" width="302" height="270" rx="10"/><text class="group-lb" x="598" y="206">ChatClient · advisor chain (ngoài → trong)</text></g>`;
  s += `<g id="edges">${Object.values(E).map(e => `<path class="edge" id="e-${e.id}" d="${e.d}"/>`).join("")}</g>`;
  s += `<g id="nodes">`;
  for (const n of Object.values(N)) {
    const table = n.id.startsWith("t_");
    s += `<g class="node k-${n.kind}" id="n-${n.id}"><rect class="box" x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="${table ? 6 : 9}"/>`;
    s += `<rect class="bar" x="${n.x + 7}" y="${n.y + 8}" width="3" height="${n.h - 16}" rx="1.5"/>`;
    if (n.id === "browser") {
      s += `<text class="lb" x="${n.x + 18}" y="${n.y + 26}">${n.label}</text><text class="sb" x="${n.x + 18}" y="${n.y + 42}"${fit(n.sub, n.w - 26, 6.1)}>${n.sub}</text>`;
      SCREENS.forEach((name, i) => {
        const y = n.y + 64 + i * 40;
        s += `<rect x="${n.x + 16}" y="${y}" width="${n.w - 30}" height="30" rx="7" fill="var(--tint2)" stroke="var(--edge)"/><text class="sb" x="${n.x + 28}" y="${y + 19}" style="fill:var(--ink)">${name}</text>`;
      });
      s += `<text class="sb" x="${n.x + 18}" y="${n.y + 290}">fetch-event-source · SSE</text><text class="sb" x="${n.x + 18}" y="${n.y + 306}">Authorization: Bearer JWT</text>`;
    } else if (n.id === "sec") {
      s += `<text class="lb" x="${n.x + 18}" y="${n.y + 21}">${n.label}</text><text class="sb" x="${n.x + n.w - 12}" y="${n.y + 21}" text-anchor="end">oauth2-resource-server · quick-login → JWT 24h</text>`;
    } else if (table) {
      s += `<text class="lb" x="${n.x + 18}" y="${n.y + 19}" style="font:500 12px var(--font-mono)">${n.label}</text>`;
      if (n.tag) s += `<text class="tag" x="${n.x + n.w - 10}" y="${n.y + 19}" text-anchor="end">${n.tag}</text>`;
    } else {
      const room = n.w - 26 - (n.tag ? n.tag.length * 6.2 + 8 : 0);
      s += `<text class="lb" x="${n.x + 18}" y="${n.y + (n.h > 44 ? 23 : 17)}"${fit(n.label, room, 7)}>${n.label}</text><text class="sb" x="${n.x + 18}" y="${n.y + (n.h > 44 ? 39 : 31)}"${fit(n.sub, n.w - 26, 6.1)}>${esc(n.sub)}</text>`;
      if (n.tag) s += `<text class="tag" x="${n.x + n.w - 10}" y="${n.y + 17}" text-anchor="end">${n.tag}</text>`;
    }
    s += `</g>`;
  }
  s += `</g><g id="dots"></g></svg>`;
  document.getElementById("stage").innerHTML = s + `<div class="cpt" id="cpt" hidden></div>`;

  const svg = document.querySelector("#stage svg");
  const dotsG = svg.querySelector("#dots");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ───────────────────────── state ─────────────────────────
  let flow = FLOWS[0], idx = 0, timer = null, raf = null, live = [];
  const $ = id => document.getElementById(id);

  const tabs = document.querySelector(".tabs");
  tabs.innerHTML = FLOWS.map((f, i) => `<button type="button" role="tab" class="k-${f.kind}" aria-selected="${i === 0}" data-i="${i}">${f.name}</button>`).join("");
  tabs.onclick = e => { const b = e.target.closest("button[data-i]"); if (b) selectFlow(+b.dataset.i); };

  function selectFlow(i) {
    stop();
    flow = FLOWS[i];
    tabs.querySelectorAll("button").forEach((b, j) => b.setAttribute("aria-selected", String(j === i)));
    $("steps").innerHTML = flow.steps.map((_, j) => `<button type="button" aria-label="Bước ${j + 1}" data-j="${j}"></button>`).join("");
    show(0);
  }
  $("steps").onclick = e => { const b = e.target.closest("button[data-j]"); if (b) { stop(); show(+b.dataset.j); } };

  function show(j) {
    idx = Math.max(0, Math.min(flow.steps.length - 1, j));
    const st = flow.steps[idx];
    closeSnip();
    const cpt = document.getElementById("cpt");
    // A step with c: true is drawn like a concept slide, so one tab can mix them with the architecture diagram.
    const concept = !!flow.concept || !!st.c;
    svg.toggleAttribute("hidden", concept);
    cpt.hidden = !concept;
    // A slide without role/why text (the demo agenda) shows only its title.
    $("roleRow").hidden = !concept || !st.role;
    $("whyRow").hidden = !concept || !st.why;
    $("text").hidden = concept;
    $("code").hidden = concept;
    if (concept) {
      cancelAnimationFrame(raf);
      dotsG.innerHTML = "";
      if (st.cover) { Concepts.stop(); cpt.innerHTML = COVER; }
      else Concepts.mount(cpt, flow.concept ? idx : st);
      document.querySelector(".cap").className = `cap k-${st.kind}`;
      $("n").textContent = `${String(idx + 1).padStart(2, "0")} / ${String(flow.steps.length).padStart(2, "0")}`;
      $("flowname").textContent = st.group ? `${flow.name} · ${st.group}` : flow.name;
      const [roleLb, whyLb] = st.labels || ["Vai trò", "Vì sao cần"];
      $("roleRow").querySelector("b").textContent = roleLb;
      $("whyRow").querySelector("b").textContent = whyLb;
      $("title").textContent = st.title;
      $("role").textContent = st.role;
      $("why").textContent = st.why;
      $("steps").querySelectorAll("button").forEach((b, k) => {
        b.classList.toggle("past", k < idx);
        if (k === idx) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
      });
      return;
    }
    Concepts.stop();
    const inFlow = new Set();
    const arch = flow.steps.filter(x => !x.c);
    arch.forEach(x => { x.nodes.forEach(n => inFlow.add(n)); x.edges.forEach(e => { const id = Array.isArray(e) ? e[0] : e; inFlow.add(E[id].a); inFlow.add(E[id].b); }); });
    const seen = new Set(flow.steps.slice(0, idx).filter(x => !x.c).flatMap(x => x.nodes));
    const on = new Set(st.nodes);
    const skip = new Set(st.skip || []);
    const overview = flow.id === "overview";
    for (const n of Object.values(N)) {
      const g = svg.querySelector(`#n-${n.id}`);
      g.classList.toggle("on", on.has(n.id) && !st.all);
      g.classList.toggle("seen", seen.has(n.id) && !on.has(n.id));
      // focus flows light only the current step's nodes, so each step adds to the picture instead of showing it all up front.
      const lit = flow.focus ? on.has(n.id) : overview ? st.all || on.has(n.id) : inFlow.has(n.id);
      g.classList.toggle("dimmed", skip.has(n.id) || !lit);
      g.classList.toggle("pulse", on.has(n.id) && !st.all && !reduce);
    }
    const seq = st.edges.map(e => Array.isArray(e) ? { id: e[0], rev: e[1] === 1 } : { id: e, rev: false });
    const hot = new Set(seq.map(x => x.id));
    svg.querySelectorAll(".grp").forEach(g => g.classList.toggle("on", (st.groups || []).includes(g.id.slice(2))));
    svg.querySelectorAll(".edge").forEach(p => {
      const id = p.id.slice(2);
      p.style.display = E[id].only && ![].concat(E[id].only).includes(flow.id) ? "none" : "";
      p.setAttribute("class", `edge${hot.has(id) ? ` hot k-${flow.kind}` : ""}`);
      const dim = st.all ? false : !hot.has(id);
      p.classList.toggle("dimmed", dim);
    });
    // dots
    dotsG.innerHTML = "";
    live = seq.map(({ id, rev }, k) => {
      const path = svg.querySelector(`#e-${id}`);
      const c = document.createElementNS(svgNS, "circle");
      c.setAttribute("r", "5"); c.setAttribute("class", `dot k-${flow.kind}`);
      dotsG.appendChild(c);
      return { path, len: path.getTotalLength(), rev, c, k };
    });
    startDots();
    // caption
    document.querySelector(".cap").className = `cap k-${flow.kind}`;
    $("n").textContent = `${String(idx + 1).padStart(2, "0")} / ${String(flow.steps.length).padStart(2, "0")}`;
    $("flowname").textContent = flow.name;
    const snips = (st.snips || []).map(k => SNIP[k]);
    // A condensed snippet's file name is left out when the same step also shows that file with line numbers.
    const numbered = new Set(snips.filter(x => x.file).map(x => base(x.file)));
    const refs = snips.filter(x => x.file || !numbered.has(x.ref)).map(ref);
    $("code").textContent = [...refs, st.code].filter(Boolean).join(" · ");
    $("code").classList.toggle("has-snip", snips.length > 0);
    if (snips.length) { $("code").setAttribute("role", "button"); $("code").tabIndex = 0; $("code").setAttribute("aria-expanded", "false"); }
    else { $("code").removeAttribute("role"); $("code").removeAttribute("tabindex"); $("code").removeAttribute("aria-expanded"); }
    closeSnip();
    $("title").textContent = st.title;
    $("text").textContent = st.text;
    $("steps").querySelectorAll("button").forEach((b, k) => {
      b.classList.toggle("past", k < idx);
      if (k === idx) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
    });
  }

  function startDots() {
    cancelAnimationFrame(raf);
    if (!live.length) return;
    const t0 = performance.now(), D = Math.min(600, 1800 / live.length), cycle = D * live.length + 700;
    const place = (d, p) => { const pt = d.path.getPointAtLength((d.rev ? 1 - p : p) * d.len); d.c.setAttribute("cx", pt.x); d.c.setAttribute("cy", pt.y); };
    if (reduce) { live.forEach(d => place(d, 1)); return; }
    const tick = now => {
      for (const d of live) {
        const p = ((now - t0) % cycle - d.k * D) / D;
        d.c.setAttribute("opacity", p < 0 || p > 1 ? "0" : "1");
        if (p >= 0 && p <= 1) place(d, p);
      }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
  }

  // ───────────────────────── code pop-up (manual: click the file reference; Play never opens it) ─────────────────────────
  const SNIP = JSON.parse(document.getElementById("snippets").textContent);
  const base = f => f.split("/").pop();
  const ref = s => s.ref || `${base(s.file)}:${s.from}${s.to > s.from ? `-${s.to}` : ""}`;
  function closeSnip() { $("snip").hidden = true; if ($("code").hasAttribute("aria-expanded")) $("code").setAttribute("aria-expanded", "false"); }
  function toggleSnip() {
    const snips = flow.concept ? [] : (flow.steps[idx].snips || []).map(k => SNIP[k]);
    if (!snips.length) return;
    if (!$("snip").hidden) return closeSnip();
    $("snip").innerHTML = snips.map(s => {
      const indent = Math.min(...s.lines.filter(l => l.trim()).map(l => l.match(/^ */)[0].length));
      // Line numbers only for code copied from the repo; condensed snippets have none to show.
      const body = s.lines.map((l, k) => (s.from ? `<i>${s.from + k}</i>` : "") + esc(l.slice(indent))).join("\n");
      return (snips.length > 1 ? `<div class="f">${esc(ref(s))}</div>` : "") + `<pre>${body}</pre>`;
    }).join("");
    $("snip").hidden = false;
    $("code").setAttribute("aria-expanded", "true");
  }
  $("code").onclick = toggleSnip;
  $("code").onkeydown = e => { if (e.key === "Enter") toggleSnip(); };
  // A click anywhere outside the pop-up closes it; the file reference keeps its own toggle.
  document.addEventListener("click", e => {
    if (!$("snip").hidden && !e.target.closest("#snip, #code")) closeSnip();
  });

  function stop() { clearInterval(timer); timer = null; $("play").textContent = "▶ Play"; }
  function play() {
    if (timer) return stop();
    if (idx >= flow.steps.length - 1) show(0);
    $("play").textContent = "❚❚ Pause";
    timer = setInterval(() => { if (idx >= flow.steps.length - 1) return stop(); show(idx + 1); }, 2000);
  }
  $("prev").onclick = () => { stop(); show(idx - 1); };
  $("next").onclick = () => { stop(); show(idx + 1); };
  $("play").onclick = play;
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") closeSnip();
    else if (e.key === "ArrowRight") { stop(); show(idx + 1); }
    else if (e.key === "ArrowLeft") { stop(); show(idx - 1); }
    else if (e.key === " " && e.target === document.body) { e.preventDefault(); play(); }
    else if (/^[0-9]$/.test(e.key)) selectFlow(e.key === "0" ? 9 : +e.key - 1);
  });

  selectFlow(0);
})();
</script>
