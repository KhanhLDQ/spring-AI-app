spring:
  application:
    name: spring-AI-app
  profiles:
    default: mock
  ai:
    model:
      chat: anthropic
      embedding: openai
      image: none
      audio.speech: none
      audio.transcription: none
      moderation: none
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: never   # Flyway owns spring_ai_chat_memory (V4)
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
    openai:
      api-key: ${OPENAI_API_KEY}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kefir}
    username: ${DB_USERNAME:kefir}
    password: ${DB_PASSWORD}
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: ${kefir.knowledge.max-file-size}
      max-request-size: ${kefir.knowledge.max-file-size}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

kefir:
  cache:
    similarity-threshold: 0.85
    ttl: 24h
  memory:
    window-size: 20
  knowledge:
    max-file-size: 10MB
    max-pages: 50
    chunk-tokens: 400
    seed-on-start: true
    rag:
      top-k: 3
      similarity-threshold: 0.50
  jwt:
    signing-key: ${JWT_SIGNING_KEY:}
    ttl: 24h
  pricing:
    input-per-mtok: 2
    output-per-mtok: 10
